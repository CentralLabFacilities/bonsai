[workspace]
authors = ["Leroy Rügemer <lruegeme@techfak.uni-bielefeld.de>"]
channels = ["conda-forge"]
name = "bonsai-ui"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bun run build && bun run tauri:build"
install = { cmd="install -D -m 755 src-tauri/target/release/bonsai-ui $prefix/bin/bonsai-ui", depends-on = ["build"] }

[dependencies]
bun = ">=1.3.11,<2"
rust = ">=1.98.0,<1.99"

[target.unix.activation]
env = { CARGO_HOME = "${PROJECT_DIR}/.pixi/cargo" }