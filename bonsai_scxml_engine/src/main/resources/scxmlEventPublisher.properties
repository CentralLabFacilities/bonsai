# SCXML runtime event notification settings.
# The publisher uses one bounded queue and one delivery worker per JVM.
bonsai.scxml.events.queue.capacity=10000

# Maximum time to drain queued events when the application shuts down.
bonsai.scxml.events.shutdown.timeout.ms=2000

# Optional JSONL recording (one file per JVM session).
bonsai.scxml.recorder.enabled=false
bonsai.scxml.recorder.directory=logs/events
bonsai.scxml.recorder.queue.capacity=10000
bonsai.scxml.recorder.shutdown.timeout.ms=5000
